        title: Meine Passkeys
        intro: Mit einem Passkey kannst du dich ohne Passwort anmelden, z.B. per Fingerabdruck, Gesichtserkennung oder Sicherheitsschlüssel. Die Anmeldung mit Passwort bleibt weiterhin möglich.
        none: Noch keine Passkeys angelegt.
        add: Passkey hinzufügen
        label_placeholder: z.B. Laptop, Smartphone
        current_password: Aktuelles Passwort
        confirm_delete: "Passkey „%{label}“ wirklich löschen?"
